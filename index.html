sections:[
['Научный статус и историческая эволюция',`Методика употребляется в трёх значениях: научная дисциплина, учебный курс и технология/практика обучения. В последнем значении речь идёт о системе способов и приёмов работы учителя. Как научная дисциплина методика выявляет закономерности обучения иностранному языку и обосновывает решения о целях, содержании, методах, средствах и организации процесса.\nВ лекции С. В. Колядко представлена эволюция статуса: начало XX века — 1940-е: преимущественно приложение сравнительного языкознания; 1950-е — прикладная психология; 1960-е — прикладная педагогика; с 1970-х — самостоятельная наука. Это схема развития научных представлений, а не утверждение о полном исчезновении междисциплинарных связей.`],
['Объект, предмет и категориальный аппарат',`Объектом исследования выступает процесс обучения и овладения иностранным языком во взаимодействии учителя и учащихся. Предметом — закономерности этого процесса и способы его целенаправленной организации. Предмет обучения (иностранный язык как средство общения) нельзя отождествлять с предметом научного исследования.\nКлючевые категории: цель, содержание, принцип, подход, метод, приём, средство, форма организации, упражнение, языковой материал, навык, умение, коммуникативная компетенция, контроль и результат. Наличие собственных теоретических вопросов, исследовательских методов и понятийного аппарата позволяет говорить о научной самостоятельности методики.`],
['Базовые и смежные науки',`Лингвистика описывает единицы и закономерности языка, нормы и его использование. Психология объясняет память, внимание, мотивацию, возрастные и индивидуальные различия. Психолингвистика исследует порождение и восприятие речи, механизмы речевой деятельности и билингвизм. Педагогика и дидактика устанавливают общие закономерности, цели и принципы образования.\nСоциология, культурология, страноведение, теория межкультурной коммуникации и другие области помогают учитывать социальные и культурные условия общения. В разных научных классификациях граница между «базовыми» и «смежными» науками может проводиться неодинаково; на зачёте стоит придерживаться схемы из лекции.`],
['Методы обучения и методы исследования',`Методы обучения представляют собой способы взаимосвязанной деятельности учителя и ученика для достижения образовательной цели. В учебной лекции по упражнениям выделены объяснение, тренировка и применение. В конкретной методической системе употребляются также показ, организация практики, коммуникативные методы и их приёмы. Метод — более общий способ организации, приём — конкретное действие.\nМетоды научного исследования: наблюдение урока, анализ научной литературы и учебной документации, анкетирование, беседа, тестирование, педагогический эксперимент, количественная и качественная обработка результатов. Например, проведение теста для измерения динамики сформированности навыка — исследование; проведение тренировочного упражнения для формирования навыка — обучение.`],
['Вывод для устного ответа',`Самостоятельность методики не означает её изоляции. Она интегрирует данные базовых наук и проверяет методические решения в реальном учебном процессе. Научно обоснованное обучение предполагает связь цели, содержания, действий обучающихся и контролируемых результатов.`]

summary:['Психология объясняет условия усвоения ИЯ через внимание, память, восприятие, мышление и мотивацию.','Начальная школа: конкретность, наглядность, смена действий, посильные короткие задания.','Подростки: роль группы, самостоятельности, эмоциональной значимости общения.','Старшеклассники: рефлексия, абстрактное мышление, жизненные и профессиональные мотивы.','Возраст — ориентир для проектирования, а не жёсткий ярлык: необходимо учитывать индивидуальные различия.'],
sections:[
['Психологическая база обучения',`Обучение иностранному языку связано с восприятием нового звукового и графического материала, его осмыслением, удержанием в памяти, извлечением и использованием в общении. Внимание обеспечивает отбор информации; память — кодирование, сохранение и актуализацию; мышление — анализ, обобщение, сопоставление; воображение — создание ситуаций общения. Учебная деятельность зависит также от эмоционального состояния, самооценки, установки на успех и прошлого языкового опыта.\nУчитель не может механически переносить структуру языка в сознание ученика: он организует деятельность, в которой знания преобразуются в навыки и умения.`],
['Мотивация',`Мотивация объясняет, почему ученик включается в деятельность и продолжает её. Различают внутренние мотивы (интерес к общению и познанию) и внешние (оценка, признание, требование). При этом мотив связан с конкретной речевой задачей: надо узнать информацию, убедить, договориться, сообщить. Учитель повышает значимость материала через реальный смысл высказывания, достижимые цели, выбор и обратную связь.\nНапример, вместо бессодержательного повторения форм Perfekt можно предложить интервью о том, что партнёры делали на выходных.`],
['Младший школьный возраст',`Для младших школьников особенно значимы предметная и зрительная опора, игры с правилами, движение, ритм, короткие коммуникативные действия, многократное вариативное повторение. Внимание ещё требует организации, поэтому инструкции должны быть краткими и проверяемыми. Полезны песни, изображения, предметы, жесты, подражание образцу. Но игра оправданна только при наличии языковой и речевой цели.`],
['Подростковый возраст',`В подростковом возрасте возрастает значение общения со сверстниками, самостоятельности, оценки группой и ощущения компетентности. Уместны работа в парах, дискуссии, проекты, ролевые ситуации и выбор тем, соотносимых с интересами учащихся. Одновременно выступление перед всем классом может вызывать тревожность; поэтому важны безопасные форматы подготовки и корректная обратная связь.`],
['Старшая школа и индивидуализация',`В старшей школе расширяются возможности абстрактного мышления и сознательного анализа языковых закономерностей. Существенны дискуссии, аргументированные выступления, сопоставление культур, работа с аутентичными текстами и задачи профессионального самоопределения. Индивидуализация касается темпа, уровня языковой поддержки, сложности текста, объёма инструкции и формы ответа. Принципиально не приписывать одинаковые способности всем учащимся одной возрастной группы.`]

{
id:3,title:'Лингвистические основы. Язык, речь, билингвизм',short:'Речевой образец, интерференция',
summary:['Язык — социальная система знаков и правил; речь — её конкретное использование в коммуникативной ситуации.','Речевой образец связывает форму, значение и условия речевого употребления и служит опорой для упражнений.','Билингвизм классифицируют по разным основаниям: способу овладения, степени владения, характеру функционирования языков.','Интерференция — отклонения под влиянием другой языковой системы или ранее усвоенного материала.','Положительный перенос облегчает овладение при сходстве явлений; сходство надо проверять, а не предполагать.'],
sections:[
['Язык, речь и речевая деятельность',`Традиционная лингвистическая дихотомия, связанная с Ф. де Соссюром, различает язык как систему социально закреплённых знаков и правил и речь как индивидуальную реализацию этой системы. Речевая деятельность характеризует процесс порождения и понимания высказываний, организованный мотивом и целью. Для методики важно, что знание системы не тождественно умению действовать в общении.\nЕдиницы языка — фонемы, морфемы, слова, модели предложения; единицы речи — реализованные высказывания, речевые действия и тексты в контексте.`],
['Речевой образец',`Речевой образец — доступная модель высказывания, служащая опорой для понимания и продуцирования речи. Например: «Ich interessiere mich für Musik» → «Ich interessiere mich für Sport». Образец включает смысл, структуру и предполагаемую ситуацию применения. Он удобен для имитации, подстановки и варьирования; однако конечная цель — самостоятельный выбор языковых средств, а не бесконечное воспроизведение модели.`],
['Билингвизм',`Билингвизм — владение и использование двух языков. Классифицировать его можно по возрасту и способу овладения (ранний/поздний, естественный/учебный), степени сбалансированности компетенций (сбалансированный/доминантный), характеру использования и взаимодействия систем (координативный/смешанный в исторических классификациях). Эти характеристики относятся к разным основаниям классификации, поэтому нельзя ставить их в один взаимоисключающий перечень.`],
['Интерференция и положительный перенос',`Интерференция проявляется в отклонениях, вызванных влиянием уже освоенных языковых или речевых механизмов. Межъязыковая интерференция может приводить к калькированию русской структуры в немецком предложении; внутриязыковая — к чрезмерному распространению уже усвоенного немецкого правила. По уровню выделяют фонетические, лексические, грамматические и другие случаи.\nНапример, «Ich warte dich» вместо «Ich warte auf dich» может возникать из-за переноса управления русского «ждать кого?». «Ich habe gegeht» — пример возможной внутриязыковой гипергенерализации модели Partizip II. Положительный перенос позволяет использовать общие стратегии чтения или сходные языковые закономерности. Не каждую ошибку автоматически следует считать интерференцией: нужна обоснованная гипотеза об источнике.`],
['Методические следствия',`Учитель заранее сопоставляет трудные явления русского и немецкого языков, вводит контрастные пары и речевые образцы, даёт многообразную практику в значимых контекстах и учит замечать особенности новых структур. Нельзя полностью исключить опору на родной язык; его использование должно быть функционально оправданным.`]
],

{
id:4,title:'Дидактические и методические принципы',short:'Принципы и их реализация',
summary:['Дидактика изучает общие закономерности обучения; методика конкретизирует их применительно к ИЯ.','Общедидактические: научность, доступность, систематичность, сознательность и активность, наглядность, прочность и др.','Общеметодические: коммуникативная направленность, функциональность, ситуативность, учет родного языка и др. — состав зависит от авторской концепции.','Частнометодические конкретизируют работу с аспектом языка или видом речевой деятельности.','Принцип должен проявляться в выборе содержания, последовательности и действий учащихся, а не оставаться декларацией.'],
sections:[
['Дидактика и методика',`Дидактика исследует общие закономерности обучения независимо от предмета. Методика обучения иностранным языкам конкретизирует эти положения применительно к освоению языка как средства общения. Принципы — исходные нормативные положения, которые определяют организацию процесса и выбор способов работы. Они образуют систему и должны учитывать цели и условия обучения.`],
['Общедидактические принципы',`Научность предполагает достоверный, соответствующий уровню развития науки материал: не объяснять немецкую грамматику заведомо ложными «правилами без исключений». Доступность требует посильной сложности при постепенном повышении требований. Систематичность и последовательность предполагают логическую связь этапов и повторение. Сознательность и активность связаны с осмыслением и включённостью ученика в действия. Наглядность обеспечивает опоры (зрительные, слуховые, деятельностные). Прочность требует возвращения к материалу в новых условиях; индивидуализация — учёта различий в подготовке.`],
['Общеметодические принципы',`Для обучения ИЯ особенно значимы коммуникативная направленность и речевая активность, ситуативность, функциональность языковых форм, взаимосвязь видов речевой деятельности и учет родного языка. Например, ученики осваивают вопросительные формы не ради перечня правил, а для реального получения информации. В разных школах методики авторы формулируют и систематизируют принципы не одинаково; в устном ответе надо указывать выбранную систему и автора.`],
['Частнометодические принципы',`Частнометодические положения действуют при обучении конкретному аспекту или виду речевой деятельности. Например, учет смыслоразличительной роли фонем при обучении произношению; специальная работа над графемно-фонемными соответствиями при обучении технике чтения; введение лексических единиц в типичных сочетаниях при обучении лексике. Они не противоречат общим принципам, а конкретизируют их.`],
['Как доказать реализацию принципа',`В ответе удобно строить цепочку: «принцип → методическое требование → действие учащихся → наблюдаемый результат». Например, принцип наглядности реализуется, если учитель показывает картинку маршрута, ученик по ней строит высказывание «Gehen Sie geradeaus», а не просто смотрит на иллюстрацию. Нарушение принципа доступности — задание с большим объёмом неизвестной лексики без опор для начинающих.`]
],
terms:[['Принцип обучения','Исходное нормативное положение организации учебного процесса','Дидактика','Доступность'],['Коммуникативность','Направленность обучения на использование языка для решения речевых задач','Методика обучения ИЯ','Интервью'],['Наглядность','Использование опор для восприятия и осмысления','Дидактика','Карта города'],['Ситуативность','Связь речевых действий с условиями общения','Коммуникативная методика','Вопрос прохожему']],

errors:['Путать метод и принцип: «ролевая игра» — методический приём/форма, а не универсальный принцип.','Назвать все принципы сугубо дидактическими без различения уровней.','Приравнивать иллюстрацию к реализованной наглядности без работы с ней.','Говорить «коммуникативный урок», если все действия сводятся к формальной подстановке.'],plan:['Дидактика и методика','Понятие принципа','Общедидактические','Общеметодические','Частнометодические','Примеры реализации и нарушений'],sources:['С. Ф. Шатилов, дидактико-методические основы','Н. Д. Гальскова и соавт., раздел «Принципы обучения»','Е. Н. Соловова, лекция «Содержание, принципы и средства обучения»'],
q:[

Q.many('Что можно считать реализацией коммуникативной направленности?',['Партнёры узнают недостающие сведения','Задача — убедить собеседника','Только хоровое повторение окончаний без смысла','Обмен реальной информацией'],[0,1,3],'Коммуникативная задача имеет смысловой результат.'),
Q.match('Соотнесите принцип с реализацией.',[['Наглядность','Работа с планом маршрута'],['Прочность','Возврат к материалу в новых ситуациях'],['Систематичность','Поэтапное усложнение заданий']],'Принцип необходимо связывать с конкретным учебным действием.'),
Q.order('Выстройте обоснование методического решения.',['Назвать принцип','Вывести методическое требование','Описать действие учащихся','Указать ожидаемый результат'],'Требуется причинно-следственная линия аргументации.'),
Q.fill('Принцип, требующий соответствия сложности материала возможностям обучающихся, — принцип _____.','доступности','Доступность — относительная, зависит от опор и подготовки.'),
Q.bool('Использование любой картинки автоматически доказывает соблюдение принципа наглядности.',false,'Наглядность эффективна, если реально участвует в познавательных действиях.'),
Q.classify('Распределите примеры по преимущественному уровню.',[['Научность',0],['Коммуникативная направленность',1],['Смыслоразличительная роль фонем при постановке произношения',2],['Систематичность',0]],['Общедидактический','Общеметодический','Частнометодический'],'Границы зависят от авторской системы; здесь дана распространённая классификация.'),
Q.open('Почему нельзя назвать ролевую игру самостоятельным дидактическим принципом?','Ролевая игра — форма организации/приём работы. Принцип же задаёт общее требование, например коммуникативную направленность или ситуативность.','Покажите различие нормативного положения и конкретной технологии.'),
Q.case('Учитель объясняет правило, затем 20 минут ученики молча переписывают 30 предложений. Как усилить коммуникативность?','Добавить задачи с информационным разрывом, личностно значимым выбором, обменом вопросами и ответами; формальные упражнения оставить как этап подготовки.','Тренировка формы не исключает речевой практики.'),

{
id:5,title:'Содержание обучения иностранным языкам',short:'Компонентный состав, разные модели',
summary:['Содержание обучения отвечает на вопрос «чему учить?» и определяется целями и условиями обучения.','В компонентной модели Е. Н. Солововой выделяются лингвистический, психологический и методологический компоненты.','Лингвистический — языковой и речевой материал, тематика и ситуации; психологический — навыки и умения; методологический — способы учения и стратегии.','У Н. Д. Гальсковой содержание описывается шире через языковые, речевые, социокультурные и учебно-познавательные составляющие.','Компонентные модели нельзя механически складывать: они построены на разных основаниях и в разных теоретических рамках.'],
sections:[
['Понятие и критерии отбора содержания',`Содержание обучения иностранному языку — совокупность того, чем должен овладеть ученик для достижения целей языкового образования. Оно не сводится к списку слов или правил. Отбираются языковой материал, речевые действия, тематика общения, коммуникативные ситуации, знания о культуре, стратегии учения и способы контроля. Отбор зависит от целей, возраста, этапа обучения, времени, потребностей учащихся и условий общения. Умение участвовать в разговоре требует, кроме грамматики, понимания партнёра и выбора языковых средств с учётом ситуации.`],
['Трёхкомпонентная модель Е. Н. Солововой',`В базовом курсе лекций Е. Н. Солововой различаются лингвистический, психологический и методологический компоненты содержания. Лингвистический охватывает языковой и речевой материал: фонетику, лексику, грамматику, тексты, темы и ситуации общения. Психологический представляет навыки и умения использования языка, связанные с рецептивной и продуктивной речевой деятельностью. Методологический включает рациональные способы самостоятельного освоения языка, учебные и компенсаторные стратегии.\nНапример, тема «Reisen»: слова Bahnhof, Fahrkarte и речевые ситуации относятся к лингвистическому наполнению; умение уточнить время отправления — к психологической стороне; стратегия догадки по табло — к методологической.`],
['Другие модели состава содержания',`В более поздних подходах, представленных в учебнике Н. Д. Гальсковой и соавторов, содержание рассматривается через ориентацию на межкультурное общение и коммуникативную компетенцию. Помимо языковых знаний и речевых навыков/умений, отдельно рассматриваются социокультурные знания, опыт и учебно-познавательные действия. В лекционной и учебной традиции разные авторы определяют состав и границы компонентов по-разному.\nПри сопоставлении сначала назовите модель и критерий её построения, затем перечислите элементы. Не утверждайте, будто любой культурный материал автоматически выступает «четвёртым компонентом» трёхкомпонентной модели Солововой.`],
['Связь целей и содержания',`Если цель состоит в развитии устно-речевого общения, в содержание необходимо включить речевые задачи, партнёрское взаимодействие, средства выражения намерений, соответствующие навыки и стратегии. Для чтения расписания поезда нужны не только слова Uhr и Gleis, но и навыки быстрого распознавания информации, опора на формат табло и умение выделять требуемые сведения.\nЕдиницы содержания целесообразно группировать по темам, ситуациям общения и решаемым задачам, с опорой на уровень владения языком.`],
['Сравнение моделей — методическая осторожность',`Модель Солововой удобна для вопроса о том, чему учат на уровнях материала, навыков и способов учения. Компетентностная трактовка Гальсковой позволяет раскрыть культурную и образовательную составляющие коммуникативной компетенции. Они не являются полными совпадениями по названиям. Для устного ответа полезно не только перечислить компоненты, но и показать их на одном учебном примере.`]
],

{
id:6,title:'Упражнение, типология и система упражнений',short:'Определения, классификации, комплексы',
summary:['Упражнение у С. Ф. Шатилова — специально организованное одно- или многократное выполнение языковых/речевых операций и действий в учебных условиях.','Структура: инструкция/коммуникативная задача, материал (корпус), при необходимости образец, наглядность, ключ.','Классификации строятся по разным основаниям: функция, коммуникативность, вид речевой деятельности, способ выполнения, форма и т. д.','Языковые упражнения сосредоточены на форме; условно-речевые вводят речевую задачу при направляемой форме; речевые требуют самостоятельного решения коммуникативной задачи.','Система упражнений — не просто набор: она последовательна, взаимосвязана, достаточна и соответствует этапам формирования навыка/умения.'],
sections:[
['Определение и структура упражнения',`В лекции по теории упражнений приведено определение С. Ф. Шатилова: упражнение представляет собой специально организованное в учебных условиях одно- или многократное выполнение отдельных операций или действий речевого (либо языкового) характера. И. Л. Бим акцентирует регулярно повторяемое действие, направленное на овладение способом деятельности. А. Н. Щукин подчёркивает связь целей, содержания и учебных действий.\nЗадание — инструкция и условия выполнения; упражнение — организованное выполнение действия. Упражнение содержит коммуникативную/учебную задачу, корпус языкового материала, иногда образец, средства наглядности и ключи.`],
['Многоосевая типология упражнений',`По назначению различают аспектные (на формирование фонетических, лексических, грамматических навыков) и комплексные (в чтении, говорении, аудировании, письме). По степени коммуникативности — языковые, условно-речевые и речевые. По характеру действия — имитационные, подстановочные, трансформационные, репродуктивные, продуктивные и иные. По модальности — устные/письменные; по месту — классные/домашние; по форме работы — индивидуальные, парные, групповые.\nОдин и тот же пример может одновременно быть «устным, парным, условно-речевым, подстановочным, грамматическим»: это признаки по разным основаниям, а не конкурирующие разновидности одного перечня.`],
['Языковые, условно-речевые и речевые',`Языковое упражнение направляет внимание преимущественно на форму: «Setzt die Verben ins Perfekt». Условно-речевое вводит речевую установку при заданном языковом способе: «Widersprecht: Ich habe gestern gelernt — Nein, du hast nicht gelernt». Речевое предполагает самостоятельное речевое действие, где учащийся выбирает содержание и средства: «Plant mit eurem Partner eine Klassenfahrt und einigt euch auf ein Ziel».\nГраницы не всегда абсолютны: формулировка задания, объем опор и реальное поведение обучающихся влияют на его характеристику.`],
['Система и комплекс упражнений',`Система упражнений — упорядоченная совокупность взаимосвязанных видов и типов упражнений, обеспечивающая последовательное формирование навыков и умений. Требования: целенаправленность, преемственность, достаточность повторений, посильное возрастание сложности, вариативность, соотнесённость с этапом и выход в речевую деятельность. Комплекс — локально организованная часть системы, направленная на определённый объект, например освоение конструкции interessieren sich für.\nПоследовательность может быть такой: осмысление модели → ограниченная имитация/подстановка → вариативное употребление в условиях ситуации → самостоятельная речевая задача.`],
['Проектирование и контроль',`Преподаватель начинает с цели: какое действие должен осуществить ученик? Далее выбирает материал, тип упражнения, форму работы, объём поддержки и критерии результата. Инструкция должна быть понятной; в лекции особо подчёркнуты краткость, логика, демонстрация образца и проверка понимания. Бессистемное чередование упражнений создаёт активность, но не гарантирует формирование требуемого навыка.`]
],
terms:[['Упражнение','Организованное выполнение учебных речевых/языковых операций','С. Ф. Шатилов','Подстановка в модель'],['Задание','Инструкция и условия решения учебной задачи','Лекция «Система упражнений»','Fragt euren Partner'],['Условно-речевое упражнение','Речевая установка при ограниченном выборе языковых средств','Коммуникативная методика','Ответ-возражение по образцу'],['Система упражнений','Взаимосвязанная последовательность упражнений для достижения цели','Методика','От формы к самостоятельной речи']],

q:[
Q.one('Учащийся вставляет глаголы в Perfekt без коммуникативной задачи. Какое упражнение?',['Речевое','Языковое','Дискуссионное'],1,'Внимание направлено на формообразование.'),
Q.many('Что требуется от системы упражнений?',['Преемственность','Соответствие цели','Случайное чередование','Переход к речевому использованию'],[0,1,3],'Система должна обеспечивать закономерное продвижение к цели.'),
Q.match('Соотнесите классификационное основание и пример.',[['По назначению','Аспектное / комплексное'],['По организации','Индивидуальное / парное'],['По коммуникативности','Языковое / условно-речевое / речевое']],'Нельзя смешивать признаки разных классификационных осей.'),
Q.order('Постройте логичный комплекс упражнений на interessieren sich für.',['Осмысление значения и модели','Подстановка новых объектов интереса','Направляемые вопросы по подсказке','Свободное интервью о реальных интересах'],'Усложнение от осознания формы к самостоятельной коммуникации.'),
Q.fill('Автор определения упражнения как специально организованного выполнения операций и действий — С. Ф. _____.','Шатилов','Данное определение приводится в лекции по упражнениям.'),
Q.bool('Парное упражнение обязательно является речевым по степени коммуникативности.',false,'Форма работы и степень коммуникативности — разные основания.'),
Q.classify('Отнесите примеры по коммуникативности.',[['Setzt die Endungen ein.',0],['Widersprecht dem Lehrer nach dem Muster.',1],['Entscheidet gemeinsam, wohin ihr fahrt.',2],['Ordnet die Wörter nach Artikeln.',0]],['Языковое','Условно-речевое','Речевое'],'Смотрите, насколько ученик самостоятельно выбирает содержание для общения.'),
Q.open('В чём различие упражнения и задания?','Задание задаёт условия и инструкцию; упражнение предполагает собственно организованное выполнение языковой или речевой операции/действия.','На практике эти слова иногда употребляются близко, но в лекции акцент различён.'),
Q.case('Урок состоит из 15 однотипных подстановочных упражнений, но заявленная цель — свободный диалог. В чём ошибка?','Нет постепенного перехода к разнообразным речевым ситуациям и самостоятельному выбору средств; комплекс не отвечает конечной цели.','Автоматизация формы ещё не гарантирует умение общаться.'),
Q.design('Спроектируйте финальное упражнение комплекса на Perfekt после имитации и подстановки.','В парах учащиеся узнают, что партнёр делал вчера; задают уточняющие вопросы и находят три различия в планах/событиях, свободно выбирая лексику.','Эталон содержит речевую задачу, реальный смысл и вариативность.')]

{
id:7,title:'Психолингвистика и речевая деятельность',short:'Виды речи, механизмы, фазы',
summary:['Речевая деятельность — мотивированный, целенаправленный процесс порождения или восприятия мысли средствами языка (И. А. Зимняя).','Четыре вида РД: говорение, аудирование, чтение, письмо. Говорение и письмо преимущественно продуктивны, аудирование и чтение — рецептивны.','Репродуктивная речь воспроизводит готовое содержание/образец, продуктивная создаёт относительно самостоятельное высказывание.','Внутренняя речь служит внутренней организации мысли; внешняя имеет звучащую или письменную форму.','Фазы порождения: побудительно-мотивационная → аналитико-синтетическая → исполнительная.'],
sections:[
['Психолингвистика и речевая деятельность',`Психолингвистика исследует психологические механизмы производства, восприятия и понимания речи, их связь с мышлением, памятью, языком и ситуацией общения. В лекции приведено определение И. А. Зимней: речевая деятельность — активный, целенаправленный, мотивированный и предметный процесс выдачи и/или приёма сформированной посредством языка мысли, направленный на удовлетворение коммуникативно-познавательной потребности.\nВ теории деятельности А. А. Леонтьева существенна иерархия: деятельность соотнесена с мотивом; действие — с целью; операция — со способом выполнения в данных условиях. Речевая деятельность опосредована языковыми средствами.`],
['Виды речевой деятельности',`Говорение осуществляет устное порождение высказывания; письмо — письменное; аудирование — слуховое восприятие и понимание; чтение — зрительное восприятие и смысловую обработку текста. Рецептивными считают аудирование и чтение, продуктивными — говорение и письмо. В реальном общении они интегрируются: прочитав сообщение, учащийся отвечает устно.\nНе следует путать «рецептивный» с «пассивный»: восприятие речи требует активности прогнозирования, узнавания, смысловой обработки и проверки гипотез.`],
['Рецепция, репродукция и продукция',`Рецепция связана с пониманием поступающей информации. Репродукция — воспроизведение ранее воспринятого содержания, например пересказ по опорному тексту. Продукция — самостоятельное формирование высказывания в соответствии с целью. Репродуктивность не совпадает с отдельным видом речевой деятельности: пересказ может быть устным или письменным. Степень самостоятельности зависит от объёма опоры.`],
['Внутренняя и внешняя речь',`Внутренняя речь участвует в планировании мысли и саморегуляции и не сводится к беззвучному проговариванию полного предложения. Внешняя речь — реализованная звуковая или графическая форма общения. При письменной речи предварительное планирование часто сильнее выражено, но в спонтанной устной речи внутренние операции протекают быстро и частично свёрнуто.`],
['Фазы порождения',`Побудительно-мотивационная фаза: возникает потребность сказать что-то; уточняются мотив, адресат и коммуникативная цель. Аналитико-синтетическая: осуществляется внутреннее программирование содержания, смысловая организация, отбор лексико-грамматических средств и синтаксических моделей. Исполнительная: программа реализуется в звучащей или письменной речи; возможны текущий контроль, самокоррекция и учёт реакции собеседника.\nФазы — аналитическая модель; в живом общении процессы могут частично перекрываться.`],
['Методические следствия',`Ученик должен получать мотивированную речевую задачу, время для смыслового планирования, достаточную языковую опору и возможность реализовать намерение во внешней речи. Нельзя считать говорением в полном методическом смысле исключительно повторение формы без намерения сообщить смысл.`]
],

{
id:8,title:'Языковой и речевой навык. Речевое умение',short:'Параметры и три этапа Шатилова',
summary:['Навык — автоматизированный компонент деятельности; речевой навык — автоматизированное использование языковых средств в речевых условиях.','Языковые навыки формируются с осознанной опорой на правила и отдельные формы; речевые — функционируют в составе речевой деятельности.','Качества: автоматизированность, устойчивость, гибкость/лабильность, правильность, темп и перенос в новые условия.','С. Ф. Шатилов: ориентировочно-подготовительный → стереотипизирующе-ситуативный → варьирующе-ситуативный этапы.','Речевое умение — способность целесообразно и относительно самостоятельно решать коммуникативные задачи, используя знания и навыки.'],
sections:[
['Навык, язык и речь',`Навык — компонент деятельности, способ выполнения которого в результате тренировки становится автоматизированным. Автоматизация означает снижение необходимости сознательно контролировать каждую операцию, но не исключает возможности её осознать и скорректировать. Языковые навыки направлены на овладение единицами и операциями системы (например, правильное образование формы), речевые навыки обеспечивают своевременное использование языковых средств при порождении и понимании высказывания.\nВ отечественной методике соотношение этих понятий трактуется по-разному: в частности, у С. Ф. Шатилова проводится важное разграничение языковых и речевых навыков; у Е. И. Пассова подчёркивается речевая обусловленность автоматизации. Это разные концептуальные акценты.`],
['Качества речевого навыка',`Автоматизированность проявляется в быстром выполнении операции без постоянного обращения к правилу. Устойчивость — сохранение правильности в разных условиях, при отвлекающих факторах. Лабильность (гибкость) — изменение способа действия при изменении ситуации, способность к переносу. Нормативность — соответствие фонетическим, грамматическим и лексическим нормам. Темп и экономичность характеризуют скорость и отсутствие избыточных пауз.\nОтдельная механическая быстрота ещё не доказывает гибкость речевого навыка.`],
['Трёхэтапная модель С. Ф. Шатилова',`Ориентировочно-подготовительный этап: ученик знакомится с новым языковым явлением, уясняет форму, значение, условия использования; выполняет действия с опорой и контролем. Стереотипизирующе-ситуативный: формируется устойчивость операционной стороны через многократные однотипные, но ситуативно организованные действия, имитацию, подстановку, преобразования. Варьирующе-ситуативный: навык совершенствуется в изменяющихся речевых условиях, снижается зависимость от образца и расширяется выбор средств.\nЭти этапы не совпадают с делением урока на «объяснение — проверка — домашняя работа». Они отражают психологическую динамику навыка.`],
['Речевое умение',`Речевое умение — готовность и способность самостоятельно осуществлять речевую деятельность в соответствии с мотивом и ситуацией общения. Оно охватывает смысловое планирование, выбор языковых средств, прогнозирование реакции партнёра, управление речевым действием и контроль результатов. В отличие от навыка, умение имеет комплексный, творческий и целенаправленный характер. Например, правильное использование вопросительных форм — навык; проведение интервью и получение нужных сведений — речевое умение.`],
['Формирование навыков на уроке',`Учитель выстраивает работу от осмысления и выполнения по опоре к многократной вариативной тренировке, затем к использованию в продуктивной или рецептивной деятельности. При формировании навыка следует следить за правильностью, скоростью, устойчивостью и переносом, а не только количеством выполненных упражнений.`]
],

Q.bool('Механическое правильное повторение 20 предложений доказывает сформированность речевого умения.',false,'Нужна самостоятельная организация речевого действия для решения задачи.'),

Q.open('Почему быстрый ответ по выученной модели ещё не гарантирует лабильности навыка?','Скорость в одной ситуации не доказывает перенос в новые условия. Лабильность проверяется через вариативные контексты и изменение речевых задач.','Назовите ситуацию, в которой форма должна быть выбрана по-новому.'),

{
id:9,title:'Фонетические навыки. Русский и немецкий',short:'Слух, артикуляция, интонация',
summary:['Фонетический навык — автоматизированные слуховые и речемоторные операции восприятия/реализации фонетических единиц (лекция С. В. Колядко).','Основные группы: слухо-произносительные (аудитивные и произносительные) и ритмико-интонационные.','Фонематический слух обеспечивает различение смыслоразличительных фонем, фонетический — восприятие звуковых особенностей.','Немецкий язык требует освоения вокалической долготы, умлаутов, /ç/ и /x/, фонем и особенностей ударения и интонации.','Сопоставление с русским помогает прогнозировать произносительные трудности; фонетическая ошибка может менять смысл.'],
sections:[
['Фонетика и её значение в обучении',`Фонетика как аспект обучения включает звуки и их сочетания, ударение, ритм, мелодику, интонацию и паузацию. Фонетическая сторона речи обеспечивает разборчивость высказывания и понимание собеседника. Фонетические навыки работают при говорении и аудировании, а через внутреннее проговаривание и графико-звуковые связи — также при чтении и письме. Нарушение смыслоразличительных признаков звука иногда затрудняет либо изменяет понимание.`],
['Определение и виды навыков',`В лекции С. В. Колядко фонетические навыки определяются как автоматизированные слуховые и речемоторные операции, обеспечивающие восприятие и реализацию единиц фонетического уровня языка в соответствии с нормой. Слухо-произносительные навыки включают аудитивный компонент (узнавание и различение фонем, слов и синтагм) и произносительный (правильная артикуляция и соединение звуков в речи). Ритмико-интонационные навыки обеспечивают верное акцентно-ритмическое и мелодическое оформление высказывания и его понимание.`],
['Восприятие и виды речевого слуха',`Речевой слух — способность воспринимать звуковую речь и её различительные свойства. Фонематический слух позволяет различать фонемные противопоставления, влияющие на значение слова; фонетический — замечать особенности реального звучания, в том числе интонационные и артикуляционные варианты. Для обучения нужны и слуховая дифференциация, и артикуляционное воспроизведение: распознавать долготу и самостоятельно правильно воспроизводить её — не одно и то же.`],
['Сопоставление русского и немецкого',`В немецком языке фонологически значима оппозиция долгих и кратких гласных: bieten /ˈbiːtən/ — bitten /ˈbɪtən/. Для русскоязычных учащихся трудны переднеязычные огублённые гласные /yː/ (Tür), /øː/ (schön), распределение /ç/ (ich) и /x/ (Bach), увулярный /ʁ/ (регионально вариативен), носовой /ŋ/ (singen), твёрдый приступ перед гласными и различная степень редукции. Часть согласных артикуляционно близка русским, но не абсолютно тождественна. Особенности немецких словесных и фразовых ударений, ритма и мелодики тоже требуют специальной практики.`],
['Типичные трудности и методический ответ',`Из-за русской интерференции ученик может не различать долготу гласных, произносить передние огублённые через неогублённые русские аналоги, заменять /ŋ/ сочетанием /н+г/, нарушать немецкое ударение. Работа включает слуховое распознавание, артикуляционную опору, противопоставление, повторение и использование в речевых ситуациях. Нужно оценивать как фонетическую правильность, так и коммуникативную значимость ошибки.`]

{
id:10,title:'Методическая типология звуков и фонетическая зарядка',short:'Подходы, комплекс упражнений',
summary:['Методическая типология группирует звуки по предполагаемой трудности на основе сопоставления с родным языком: близкие, частично сходные, отсутствующие.','Подходы к постановке произношения: имитативный и аналитико-имитативный; аналитическое объяснение — существенная составляющая второго.','Комплекс движется от восприятия/различения к воспроизведению, автоматизации и употреблению в речи.','Фонетическая зарядка предупреждает деавтоматизацию и поддерживает текущую речевую работу.','По лекции: 3–5 минут, одна ясная цель, небольшой объём (около 7–10 слов или 4–6 фраз), разные режимы и связь с темой урока.'],
sections:[
['Зачем нужна методическая типология звуков',`Фонемы иностранного языка неодинаково сложны для конкретной языковой аудитории. Сравнение артикуляционных и акустических признаков с фонемами родного языка позволяет выделить три группы: близкие к родным, частично совпадающие (но имеющие существенные различия) и отсутствующие в родном языке. Эта группировка помогает выбрать объём объяснения, количество дифференцировочных упражнений и интенсивность тренировки.\nСходство букв не гарантирует фонетического совпадения: немецкое w представляет /v/, а немецкое z — /t͡s/. И даже частично сходный звук может вызывать устойчивую интерференцию.`],
['Подходы к введению звука',`Имитативный подход основывается на восприятии корректного образца и подражании. Он пригоден для относительно доступных звуков и учащихся с хорошим слуховым контролем. Аналитический компонент предусматривает осознанное объяснение артикуляции: положения языка, губ, характера воздушной струи. Аналитико-имитативный подход соединяет объяснение и подражание; обычно он продуктивен при постановке трудных звуков, отсутствующих в русском. В лекции особо выделены имитативный и аналитико-имитационный методы, поэтому это центральная пара для экзаменационного ответа.`],
['Этапы формирования навыков и упражнения',`По логике формирования речевого навыка сначала создаётся ориентировка: предъявление фонемы, осознание смыслоразличительного признака, образец и артикуляционный комментарий. Далее организуется стереотипизирующая тренировка: узнавание звука на слух, определение позиции в слове, повторение, противопоставление минимальных пар, воспроизведение в словах и фразах. Наконец, звук интегрируется в изменяющиеся речевые ситуации, чтение и говорение, где внимание смещается на смысл.`],
['Фонетическая зарядка',`Фонетическая зарядка — краткое специально организованное упражнение или этап урока, направленный на поддержание и совершенствование слухо-произносительных и ритмико-интонационных навыков, в частности на предупреждение их деавтоматизации (определения представлены в лекции через А. Н. Щукина и Г. В. Рогову). Она может располагаться в начале урока или перед конкретной работой с говорением/чтением.\nЛекционные требования: целенаправленность, связь с текущим языковым материалом, ограниченный объём, высокий темп, последовательное чередование режимов, речевая ценность, интерес к материалу. Примерный ориентир: 3–5 минут и 7–10 слов либо 4–6 фраз. Нельзя превращать зарядку в длинное несвязанное с темой занятие.`],
['Пример зарядки',`Тема «Freizeit», цель — /ç/ в ich, mich, dich. Учитель предъявляет слова и фразы, учащиеся узнают нужный звук, затем повторяют индивидуально и в парах, после чего в коротком вопросе «Was machst du?» используют фразы «Ich interessiere mich ...». В конце — краткая содержательная реакция. Материал мал, цель конкретна, есть связь с дальнейшим говорением.`]
],

Q.fill('По лекции типичная продолжительность фонетической зарядки — от 3 до _____ минут.','5','Указан ориентир 3–5 минут.'),
Q.bool('Фонетическую зарядку можно провести прямо перед чтением вслух, если она готовит трудные сочетания текста.',true,'Цель определяет место зарядки в уроке.'),
Q.classify('Выберите подходящую методическую реакцию.',[['Новое артикуляционное положение для /øː/',1],['Относительно доступное [m]',0],['Контраст долгих/кратких немецких гласных',1],['Простое повторение знакомого [n]',0]],['Преимущественно имитация','Анализ + имитация'],'Критерий — характер фонетической трудности.'),
Q.open('Зачем связывать зарядку с последующим речевым материалом урока?','Чтобы звуковые операции переносились в речевую деятельность и материал не оставался изолированной имитацией.','Назовите конкретный речевой результат.'),
Q.case('Учитель 12 минут работает над 40 несвязанными словами. В чём нарушения?','Превышена длительность и объём; отсутствуют единая цель, тематическая связь и продуктивный темп. Нужно выбрать 7–10 слов или 4–6 фраз под одну задачу на 3–5 минут.','Требования из лекции С. В. Колядко.'),

{
id:11,title:'Технические навыки чтения',short:'Графика, звук, автоматизация',
summary:['Техника чтения охватывает операции распознавания графических знаков, соотнесения графической и звуковой формы, узнавания слов и их группировки для смыслового чтения.','Нужно различать техническую сторону чтения и смысловое понимание текста, не разрывая их связи.','Подходы к первоначальному обучению чтению: от буквы/звука к слову; от целого слова/фразы к анализу; комбинированное введение графемных закономерностей.','Немецкие соответствия: ei /aɪ/, ie /iː/, eu/äu /ɔʏ/, sch /ʃ/, z /t͡s/, w /v/, sp/st в начале корня /ʃp,ʃt/ и др.','Комплекс: узнавание графемы → чтение сочетания → слово → словосочетание → фраза → связный текст и смысловая задача.'],
sections:[
['Понятие технических навыков чтения',`Чтение — рецептивный вид речевой деятельности, направленный на понимание письменного текста. Его техническая сторона включает зрительное различение графических единиц, установление графемно-фонемных соответствий, узнавание слов, их структурную организацию и автоматизацию перцептивных операций. У Н. Д. Гальсковой и соавторов техника чтения описывается как навыки и умения перцептивной переработки языковой стороны текста, ведущие к пониманию. По мере развития чтения автоматизация освобождает ресурсы для смысловой переработки.`],
['Техника и понимание',`Чтение вслух помогает контролировать графико-звуковые соответствия и фонетическое оформление; чтение про себя создаёт условия для более эффективного смыслового восприятия. Правильная озвучка сама по себе не равна пониманию, но недостаточное распознавание слов препятствует смысловой работе. Техника становится инструментом, а не конечной целью зрелого читателя. В обучении важны зрительный, речемоторный и другие участвующие анализаторы.`],
['Подходы к обучению начальной технике',`При обучении по буквенно-звуковому принципу ученик осваивает отдельные графемы и закономерности их звучания, затем соединяет их в слова. При обучении от целостного образа слова/фразы учащийся первоначально узнаёт значимую единицу, а затем анализирует её графическую структуру. Комбинированный путь сочетает известные целые слова с целенаправленным введением правил чтения. Терминология учебников отличается; важно говорить о методическом механизме, а не смешивать подходы к начальной технике с видами смыслового чтения (ознакомительное, изучающее, поисковое).`],
['Немецкая графика и фонетика',`Немецкие сочетания требуют специальных связей графем и звуков: ei → /aɪ/ (mein), ie → /iː/ (Liebe), eu/äu → /ɔʏ/ (neu/Häuser), sch → /ʃ/ (Schule), ch после передних гласных часто /ç/ (ich), после задних /x/ (Bach), z → /t͡s/ (Zeit), w → /v/ (Wasser), sp/st в начале слова и корня часто /ʃp/, /ʃt/ (Sport, Stadt). Буква v может обозначать /f/ в Vater и /v/ в Vase. Правила следует давать с контекстом и оговорками, избегая ложной универсальности.`],
['Комплекс упражнений',`Этап 1: узнавание графемы, зрительное выделение сочетания. Этап 2: соотнесение написания и звучания, классификация слов по правилу, чтение минимально контрастных единиц. Этап 3: чтение слов и словосочетаний с постепенным ускорением распознавания. Этап 4: чтение фраз с фразовым членением и интонацией. Этап 5: небольшой текст и решение смысловой задачи — найти время, имя, место. Учитель контролирует точность, темп и осмысленность чтения.`]
],

sections:[
['Понятие и цель обучения лексике',`Лексический навык обеспечивает автоматизированное узнавание и извлечение лексических единиц, а также выбор и употребление слова в соответствии со смыслом, нормами сочетаемости и ситуацией общения. Цель обучения — не количество выученных переводов, а возможность понимать и передавать смысл с использованием лексических средств. Лексическая единица включает слово, устойчивое словосочетание либо другую целостную единицу употребления; существенны её форма, значение и речевые связи.`],
['Продуктивные и рецептивные навыки',`Продуктивный лексический навык обеспечивает самостоятельный выбор слова и его сочетание с другими единицами в говорении и письме. Рецептивный обеспечивает узнавание и понимание лексической единицы в аудировании и чтении. Активный словарь включает единицы, которыми учащийся должен пользоваться самостоятельно; пассивный — узнаваемые при восприятии; потенциальный — единицы, смысл которых можно предположить по известным словообразовательным элементам и контексту. Эти понятия нельзя механически приравнять к единственному моменту изучения слова.`],

<script>

const paragraphs=s=>String(s||'').split('\n').filter(Boolean).map(x=>`<p>${E(x)}</p>`).join('');

 const m=MODULES[id-1], read=(saved.read[id]||[]).length/m.sections.length;

 const accuracy=done? scores.reduce((a,b)=>a+b,0)/done:0;
 const practice=scores.reduce((a,b)=>a+b,0)/m.q.length;
 return {read,practice,done,accuracy,ready:.4*read+.6*practice};
};

const qTypes={one:'Один вариант',many:'Несколько вариантов',match:'Сопоставление',order:'Последовательность',fill:'Заполнение пропуска',bool:'Верно / неверно',classify:'Распределение по группам',open:'Открытый ответ',case:'Методический кейс',design:'Проектирование',flash:'Флеш-карточка'};

 if(q.type==='fill')return `<input class="answer-input" id="fillAnswer" type="text" autocomplete="off" placeholder="Введите термин или ответ…" aria-label="Впишите ответ"><p class="hint">Допускаются разные регистры и лишние пробелы.</p>`;

function checkQuestion(){const q=mod().q[state.question], t=q.type;const manual=['open','case','design','flash'].includes(t);

 if(t==='one'||t==='many'||t==='bool'){

 if(t==='many'){const hits=values.filter(v=>q.a.includes(v)).length;const errs=values.filter(v=>!q.a.includes(v)).length;score=cap((hits-errs)/q.a.length,0,1)}

 score=values.filter((v,i)=>v===q.p[i][1]).length/q.p.length;correct=q.p.map(x=>`${x[0]} — ${x[1]}`).join(' | ');
 }else if(t==='order'){
 score=state.sort.filter((j,i)=>j===i).length/q.o.length;correct=q.o.map((x,i)=>`${i+1}. ${x}`).join(' → ');
 }else if(t==='classify'){

 score=values.filter((v,i)=>Number(v)===q.items[i][1]).length/q.items.length;correct=q.items.map(x=>`${x[0]} — ${q.cats[x[1]]}`).join(' | ');

if(e.phase==='prep'||e.phase==='answer')return start+`<div class="panel"><div class="titleline"><span class="pill">Билет №${m.id}</span><span class="pill">${e.phase==='prep'?'Подготовка':'Ответ'}</span></div><h2 style="margin:18px 0 8px">${E(m.title)}</h2><p class="muted">${e.phase==='prep'?'Составьте мысленный план ответа, распределите время по пунктам. Теоретические подсказки не открываются.':'Отвечайте вслух, выдерживая последовательность. Можно записывать тезисы для последующей самооценки.'}</p><div id="examClock" class="exam-timer" aria-live="off">${fmtTime(e.remaining)}</div><div class="actionrow" style="justify-content:center"><button class="btn secondary" data-exam-pause="1">${e.paused?'▶ Продолжить':'Ⅱ Пауза'}</button><button class="btn" data-exam-next="1">${e.phase==='prep'?'Начать ответ →':'Завершить ответ →'}</button></div>${e.phase==='answer'?`<hr class="sep"><h3>Заметки и необязательная диктовка</h3><textarea id="examTranscript" class="text-area" placeholder="При необходимости записывайте свой ответ…">${E(e.transcript)}</textarea><div class="actionrow"><button class="btn secondary small" data-speech="1">🎙 Начать / остановить диктовку</button></div><p class="notice">Распознавание речи зависит от браузера и может использовать внешние сервисы поставщика браузера. Без него сайт работает полностью офлайн. Текст не проверяется автоматически на достоверность.</p>`:''}</div>`;
const probes=[{level:'Базовый',q:m.q.find(x=>x.type==='open')},{level:'Повышенный',q:m.q.find(x=>x.type==='case')},{level:'Сложный',q:m.q.find(x=>x.type==='design')||m.q.find(x=>x.type==='flash')}].filter(x=>x.q);
return start+`<div class="panel"><span class="pill">Билет №${m.id}</span><h2 style="margin:14px 0 8px">${E(m.title)}</h2><p class="muted">Отметьте пункты, которые вы действительно раскрыли в устном ответе. Это самостоятельная оценка полноты, а не автоматическая экспертиза речи.</p><div id="examRubric">${m.plan.map((x,i)=>`<label class="rubric-item"><input type="checkbox" data-rubric="${i}"> <span>${E(x)}</span></label>`).join('')}</div><div id="examOutcome" class="callout">Отмечено: 0 / ${m.plan.length}. Условная полнота: 0%.</div>${e.transcript?`<h3>Ваши заметки</h3><div class="student-note">${E(e.transcript)}</div>`:''}</div>
<div class="panel"><h2>Дополнительные вопросы преподавателя</h2><p class="notice">Сначала ответьте устно, затем раскройте возможный эталон. ${e.strict?'В строгом режиме представлены все три уровня.':'Представлен один базовый вопрос.'}</p>${(e.strict?probes:probes.slice(0,1)).map(z=>`<div class="lesson-block"><span class="question-type">${E(z.level)}</span><h3 style="margin-top:8px">${E(z.q.t)}</h3><details><summary style="cursor:pointer;color:var(--accent);font-weight:700">Показать пример ответа</summary><p style="margin-top:10px">${E(z.q.a)}</p><p class="muted smalltext">${E(z.q.why)}</p></details></div>`).join('')}</div>
<div class="actionrow"><button class="btn" data-exam-save="1" ${e.saved?'disabled':''}>${e.saved?'Результат сохранён':'Сохранить самооценку'}</button><button class="btn secondary" data-exam-again="1">Новый билет</button><button class="btn ghost" data-topicview="theory" data-topic="${m.id}">Повторить теорию билета</button></div>`;
}
function fmtTime(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function startClock(){clearInterval(timer);timer=setInterval(()=>{let e=state.exam;if(e.phase!=='prep'&&e.phase!=='answer'){clearInterval(timer);return}if(e.paused)return;e.remaining=Math.max(0,e.remaining-1);const clock=document.querySelector('#examClock');if(clock)clock.textContent=fmtTime(e.remaining);if(e.remaining===0)advanceExam()},1000)}
function advanceExam(){let e=state.exam;if(e.phase==='prep'){e.phase='answer';e.remaining=e.answer*60;e.paused=false;startClock()}else if(e.phase==='answer'){e.phase='review';e.remaining=0;clearInterval(timer);stopSpeech()}render()}
function stopSpeech(){if(recognition){try{recognition.stop()}catch{} recognition=null}}
function setupSpeech(){let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('Распознавание речи в этом браузере не поддерживается');return}if(recognition){stopSpeech();toast('Диктовка остановлена');return}recognition=new Speech();recognition.lang='ru-RU';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=evt=>{let output='';for(let i=evt.resultIndex;i<evt.results.length;i++){if(evt.results[i].isFinal)output+=' '+evt.results[i][0].transcript}state.exam.transcript=(state.exam.transcript+output).trim();const t=document.querySelector('#examTranscript');if(t)t.value=state.exam.transcript};recognition.onerror=evt=>toast('Диктовка: '+evt.error);recognition.onend=()=>{recognition=null};try{recognition.start()}catch{recognition=null;toast('Диктовка не запущена')}}
// Input handling is delegated only for supported interactive controls; free-text answers are never sent to a server.
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
 if(b.dataset.view){go(b.dataset.view);return}
 if(b.dataset.topicview){go(b.dataset.topicview,b.dataset.topic);return}
 if(b.dataset.topic){go(state.view==='practice'?'practice':'theory',b.dataset.topic);return}
 if(b.id==='mobileMenu'){document.body.classList.toggle('menu-open');return}
 if(b.id==='themeBtn'){saved.theme=saved.theme==='dark'?'light':'dark';store();render();return}
 if(b.id==='resetBtn'){if(confirm('Сбросить все отметки, ответы и результаты устных репетиций?')){saved.read={};saved.answers={};saved.oral=[];store();go('home');toast('Прогресс сброшен')}return}
 if(b.dataset.hidden){state.hideTheory=!state.hideTheory;render();return}
 if(b.dataset.mark!==undefined){let id=mod().id,i=Number(b.dataset.mark);let arr=saved.read[id]||[];saved.read[id]=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];store();render();return}
 if(b.dataset.errors){state.incorrectOnly=!state.incorrectOnly;const a=availableQs();initQuestion(a[0]??0);render();return}
 if(b.dataset.randomq){let a=availableQs();if(a.length){initQuestion(a[Math.floor(Math.random()*a.length)]);render()}return}
 if(b.dataset.q!==undefined){initQuestion(Number(b.dataset.q));render();return}
 if(b.dataset.move!==undefined){let i=Number(b.dataset.move),j=i+Number(b.dataset.dir);if(j>=0&&j<state.sort.length){[state.sort[i],state.sort[j]]=[state.sort[j],state.sort[i]];render()}return}
 if(b.dataset.check){const q=mod().q[state.question];if(['open','case','design'].includes(q.type)){state.answerDraft=app.querySelector('#freeAnswer')?.value||''}else state.answerDraft='';checkQuestion();return}
 if(b.dataset.rate!==undefined){let score=Number(b.dataset.rate);state.checked={score,explanation:'Это ваша самооценка полноты ответа по эталону.',correct:mod().q[state.question].a};recordAnswer(score);render();return}
 if(b.dataset.retry){initQuestion(state.question);render();return}
 if(b.dataset.next){nextQuestion();return}
 if(b.dataset['examStart']){const selection=document.querySelector('#examTopic').value;let e=state.exam;e.topic=selection==='random'?Math.floor(Math.random()*12)+1:Number(selection);e.prep=cap(Number(document.querySelector('#examPrep').value)||3,1,30);e.answer=cap(Number(document.querySelector('#examAns').value)||5,1,30);e.strict=document.querySelector('#examStrict').checked;e.phase='prep';e.remaining=e.prep*60;e.paused=false;e.saved=false;e.transcript='';startClock();render();return}
 if(b.dataset['examPause']){state.exam.paused=!state.exam.paused;render();return}
 if(b.dataset['examNext']){if(state.exam.phase==='answer'){state.exam.transcript=document.querySelector('#examTranscript')?.value||state.exam.transcript}advanceExam();return}
 if(b.dataset.speech){setupSpeech();return}
 if(b.dataset['examSave']){if(!state.exam.saved){const checked=[...app.querySelectorAll('[data-rubric]:checked')];const score=checked.length/MODULES[state.exam.topic-1].plan.length;saved.oral.push({topic:state.exam.topic,score,date:new Date().toISOString(),strict:state.exam.strict});state.exam.saved=true;store();render();toast('Самооценка сохранена')}return}
 if(b.dataset['examAgain']){clearInterval(timer);stopSpeech();state.exam.phase='setup';render();return}
});
document.addEventListener('input',event=>{if(event.target.id==='globalSearch'){state.search=event.target.value;if(state.search.trim()) {state.view='search';renderSidebar();app.innerHTML=renderSearch()}else if(state.view==='search')go('home');return}
 if(event.target.id==='glossaryFilter'){const term=event.target.value.trim().toLocaleLowerCase('ru');let terms=MODULES.flatMap(m=>m.terms.map(x=>({topic:m.id,term:x[0],def:x[1],author:x[2],example:x[3]})));terms=terms.filter(t=>(t.term+' '+t.def+' '+t.author).toLocaleLowerCase('ru').includes(term));terms.sort((a,b)=>a.term.localeCompare(b.term,'ru'));document.querySelector('#glossaryRows').innerHTML=glossaryItems(terms)||'<p class="empty">Совпадений нет.</p>';return}
 if(event.target.id==='examTranscript')state.exam.transcript=event.target.value;
});
document.addEventListener('change',event=>{if(event.target.matches('[data-rubric]')){let all=mod();let topic=MODULES[state.exam.topic-1],n=app.querySelectorAll('[data-rubric]:checked').length;const o=app.querySelector('#examOutcome');if(o)o.textContent=`Отмечено: ${n} / ${topic.plan.length}. Условная полнота: ${Math.round(n/topic.plan.length*100)}%. ${n===topic.plan.length?'Все пункты отмечены.':'Проверьте пропущенные тезисы.'}`}});
window.addEventListener('beforeunload',()=>{clearInterval(timer);stopSpeech()});
render();

</script>
</body></html>
